<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-primary: #1e1e24;
      --bg-surface: #2a2a32;
      --text-main: #f4f4f6;
      --text-muted: #9da4b0;
      --accent-color: #5271ff;
      --accent-hover: #3b56d9;
      --border-color: #3f3f46;
      --success-color: #2ed573;
      --error-color: #ff4757;
      
      --status-info-bg: rgba(82, 113, 255, 0.15);
      --status-info-text: #708aff;
      --status-success-bg: rgba(46, 213, 115, 0.15);
      --status-success-text: #2ed573;
      --status-error-bg: rgba(255, 71, 87, 0.15);
      --status-error-text: #ff4757;
    }

    body {
      width: 380px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 16px;
      margin: 0;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .header img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .url-input-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }

    .url-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 9px 12px;
      background-color: #1a1a20;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 12.5px;
      box-sizing: border-box;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      color: white;
      flex-shrink: 0;
    }

    .btn-add { background-color: var(--success-color); }
    .btn-remove { background-color: var(--error-color); }

    .file-upload-btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 8px;
      background: #25252d;
      border: 1px dashed var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .file-upload-btn:hover {
      color: var(--text-main);
      border-color: var(--text-muted);
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }

    .toggle-label {
      font-size: 12.5px;
      font-weight: 500;
    }

    .btn-primary {
      width: 100%;
      padding: 11px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(82, 113, 255, 0.2);
    }

    .btn-primary:hover { background: var(--accent-hover); }

    #status {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.4;
      padding: 10px;
      border-radius: 8px;
      max-height: 75px;
      overflow-y: auto;
      display: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="adblock.png" alt="logo" onerror="this.style.display='none'">
    <h3>AdBlock Hook Dashboard</h3>
  </div>

  <div class="card" style="border-color: rgba(82, 113, 255, 0.3);">
    <div class="toggle-row">
      <span class="toggle-label" style="color: #708aff; font-weight: 600;">Don't block ads this page</span>
      <input type="checkbox" id="toggleWhitelist" style="cursor: pointer; transform: scale(1.2);">
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label>HOSTS ONLINE SOURCES</label>
      <div id="urlContainer" class="url-input-container">
        </div>
      <button id="btnAddUrl" class="btn-icon btn-add" style="width: 100%; margin-top: 4px;">+</button>
    </div>
  </div>

  <div class="card">
    <div class="form-group" style="margin-bottom: 0;">
      <label>CUSTOM LOCAL HOSTS (.TXT)</label>
      <label class="file-upload-btn" for="fileInput">
        <span id="fileNameLabel">📁 Choose or Drop a .txt hosts file</span>
      </label>
      <input type="file" id="fileInput" accept=".txt" style="display: none;">
    </div>
  </div>

  <div class="card" style="padding: 10px 12px; margin-bottom: 16px;">
    <div class="toggle-row">
      <span class="toggle-label" style="font-size: 11.5px; color: var(--text-muted);">
	  Redirect to fake success response instead of direct blocking [Recommended]<br/>
	  Ad-blocking test results may be inaccurate; disable this option when making a test.</span>
      <input type="checkbox" id="toggleFakeSuccess" style="cursor: pointer;">
    </div>
  </div>

  <button id="btnDownload" class="btn-primary">Sync & Update All Lists</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
