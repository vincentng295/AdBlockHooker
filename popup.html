<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 350px; font-family: Arial, sans-serif; padding: 10px; margin: 0; }
    h3 { margin-top: 0; color: #333; }
    input[type="text"] { width: 100%; padding: 6px; box-sizing: border-box; margin-bottom: 8px; }
    button { width: 100%; padding: 8px; background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
    button:hover { background: #0056b3; }
    #status { margin-top: 8px; font-size: 13px; color: green; max-height: 60px; overflow-y: auto; }
  </style>
</head>
<body>
  <h3>Configure AdBlock Hook</h3>
  <label for="hostUrl">URL file hosts:</label>
  <input type="text" id="hostUrl" placeholder="https://example.com/hosts.txt">
  <button id="btnDownload">Download and Update</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
