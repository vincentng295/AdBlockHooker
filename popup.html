<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-primary: #1e1e24;
      --bg-surface: #2a2a32;
      --text-main: #f4f4f6;
      --text-muted: #9da4b0;
      --accent-color: #5271ff;
      --accent-hover: #3b56d9;
      --border-color: #3f3f46;
      
      /* Màu cho các trạng thái */
      --status-info-bg: rgba(82, 113, 255, 0.15);
      --status-info-text: #708aff;
      --status-success-bg: rgba(46, 213, 115, 0.15);
      --status-success-text: #2ed573;
      --status-error-bg: rgba(255, 71, 87, 0.15);
      --status-error-text: #ff4757;
    }

    body {
      width: 360px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 16px;
      margin: 0;
      box-sizing: border-box;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .header img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }

    .header h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    /* Form Group */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 13px;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(82, 113, 255, 0.25);
    }

    input[type="text"]::placeholder {
      color: #5a5f6a;
    }

    /* Button */
    button {
      width: 100%;
      padding: 11px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(82, 113, 255, 0.2);
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    /* Container Trạng thái (Ẩn mặc định, hiện khi có text) */
    #status {
      margin-top: 14px;
      font-size: 12.5px;
      line-height: 1.5;
      padding: 10px 12px;
      border-radius: 8px;
      max-height: 80px;
      overflow-y: auto;
      box-sizing: border-box;
      display: none; /* Chỉ hiện khi có nội dung */
      transition: all 0.3s ease;
    }

    /* Custom Scrollbar cho status nếu text quá dài */
    #status::-webkit-scrollbar {
      width: 4px;
    }
    #status::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="adblock.png" alt="logo" onerror="this.style.display='none'">
    <h3>AdBlock Hook Config</h3>
  </div>

  <div class="form-group">
    <label for="hostUrl">HOSTS SOURCE URL</label>
    <div class="input-wrapper">
      <input type="text" id="hostUrl" placeholder="https://example.com/hosts.txt">
    </div>
  </div>

  <button id="btnDownload">Download & Update</button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
